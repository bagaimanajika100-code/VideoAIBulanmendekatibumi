<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bagaimana Jika Bulan Mendekati Bumi?</title>
<style>
:root{--bg:#05060d;--fg:#eaf2ff}
@media (prefers-color-scheme:dark){:root{--bg:#05060d;--fg:#eaf2ff}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;height:calc(100vh - 56px);aspect-ratio:9/16;max-width:100vw}
#bar{height:56px;display:flex;gap:10px;align-items:center}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid #3b4668;background:#141a2e;color:var(--fg)}
body.render canvas{width:1080px;height:1920px}
body.render #bar{display:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="bar"><button id="pp">Putar</button><button id="rs">Ulang</button><span id="tm">0.0 / 30 d</span></div>
<audio id="a" src="sfx.wav" preload="auto"></audio>
<script>
const W=1080,H=1920,DUR=30,RENDER=location.search.includes("render=1");
if(RENDER)document.body.classList.add("render");
const cv=document.getElementById("c"),g=cv.getContext("2d");cv.width=W;cv.height=H;
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
const R=rng(7),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>{x=clamp(x);return x*x*(3-2*x)},lerp=(a,b,x)=>a+(b-a)*x;
const stars=Array.from({length:260},()=>({x:R()*W,y:R()*H,r:R()*2+.6,p:R()*6.28}));
const ring=Array.from({length:900},()=>{const v=R();return{a:R()*6.2832,j:R(),s:R()*3+1.5,v,c:`hsl(30,10%,${45+v*45}%)`}});
const bld=Array.from({length:14},(_,i)=>({x:i*80+R()*20,w:50+R()*30,h:80+R()*220}));
const cr=Array.from({length:10},()=>({x:(R()-.5)*1.2,y:(R()-.5)*1.2,r:.06+R()*.09}));
const S=[[0,4,"Bagaimana jika Bulan tiba-tiba mendekati Bumi?"],[4,9,"Bulan makin besar di langit, hingga dua kali lipat dari biasanya."],[9,15,"Gravitasinya menarik laut. Pasang raksasa menenggelamkan kota pesisir."],[15,21,"Kerak Bumi ikut tertarik. Gempa dan letusan gunung api terjadi di mana-mana."],[21,26,"Di jarak belasan ribu kilometer, Bulan hancur menjadi puing."],[26,30,"Bumi pun punya cincin, tapi tak ada yang tersisa untuk melihatnya."]];
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+$)/g,".");
function dist(t){if(t<4)return 384.4;if(t<9)return lerp(384.4,190,sm((t-4)/5));if(t<15)return lerp(190,90,sm((t-9)/6));if(t<21)return lerp(90,18,sm((t-15)/6));return 18}
function moon(x,y,r,a){if(a<=0)return;g.save();g.globalAlpha=a;const gr=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);gr.addColorStop(0,"#f2f2f4");gr.addColorStop(1,"#8d909c");g.fillStyle=gr;g.shadowColor="rgba(220,230,255,.6)";g.shadowBlur=r*.25;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.shadowBlur=0;g.fillStyle="rgba(90,92,105,.35)";cr.forEach(c=>{g.beginPath();g.arc(x+c.x*r,y+c.y*r,c.r*r,0,7);g.fill()});g.restore()}
function earth(t){const tide=t<21?sm((t-9)/6):0,cy=1750-tide*50,ry=640+tide*70;g.save();g.beginPath();g.ellipse(540,cy,640,ry,0,0,7);g.clip();const gr=g.createRadialGradient(400,1500,100,540,1750,700);gr.addColorStop(0,"#4aa3ff");gr.addColorStop(.6,"#1b5fb8");gr.addColorStop(1,"#0a2a66");g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle="rgba(60,160,90,.8)";[[420,1300,120,60],[700,1450,100,70],[300,1600,90,60],[640,1250,70,40]].forEach(e=>{g.beginPath();g.ellipse(e[0],e[1],e[2],e[3],.4,0,7);g.fill()});g.restore();g.save();g.strokeStyle="rgba(130,200,255,.55)";g.lineWidth=10;g.shadowColor="#7cc4ff";g.shadowBlur=40;g.beginPath();g.ellipse(540,cy,640,ry,0,0,7);g.stroke();g.restore()}
function ringPart(t,front){if(t<21)return;const q=sm((t-21)/4.5);for(const p of ring){const a2=p.a+.1*(t-21),sn=Math.sin(a2);if((sn>0)!==front)continue;const k=.85+.3*p.j,Px=540+1000*k*Math.cos(a2),Py=1750+240*k*sn,Ox=540+Math.cos(p.a*3)*p.v*430,Oy=600+Math.sin(p.a*5)*p.v*430;g.fillStyle=p.c;g.fillRect(lerp(Ox,Px,q),lerp(Oy,Py,q),p.s,p.s)}}
function panel(t){const a=sm((t-9)/.8)*(1-sm((t-20.2)/.8));if(a<=0)return;const y0=1380,h=540;g.save();g.globalAlpha=a;g.beginPath();g.rect(0,y0,W,h);g.clip();const gr=g.createLinearGradient(0,y0,0,y0+h);gr.addColorStop(0,"#1a2340");gr.addColorStop(1,"#0b1020");g.fillStyle=gr;g.fillRect(0,y0,W,h);g.fillStyle="#d9dbe3";g.beginPath();g.arc(850,y0+110,50+clamp(t-9,0,12)*7,0,7);g.fill();g.fillStyle="#0e1428";bld.forEach(b=>g.fillRect(b.x,y0+h-b.h-40,b.w,b.h+40));
if(t>15){const ax=850,ay=y0+h-270;g.fillStyle="#2a1d1d";g.beginPath();g.moveTo(700,y0+h);g.lineTo(ax,ay);g.lineTo(1000,y0+h);g.fill();for(let i=0;i<40;i++){const tt=(t*1.1+i*.37)%1.1,vx=(Math.sin(i*12.9)*160),vy=380+(i%7)*40;g.fillStyle=i%3?"#ff7a1a":"#ffd24a";g.fillRect(ax+vx*tt,ay-vy*tt+420*tt*tt,7,7)}g.strokeStyle="rgba(255,90,30,.8)";g.lineWidth=4;g.beginPath();g.moveTo(80,y0+h-40);g.lineTo(160,y0+h-90);g.lineTo(130,y0+h-150);g.lineTo(230,y0+h-200);g.stroke()}
const rise=sm((t-9)/6)*300;g.fillStyle="rgba(40,120,220,.85)";g.beginPath();g.moveTo(0,y0+h);for(let x=0;x<=W;x+=20)g.lineTo(x,y0+h-40-rise-Math.sin(x*.02+t*5)*12);g.lineTo(W,y0+h);g.fill();g.restore()}
function wrap(txt,mw){const w=txt.split(" "),L=[];let c="";for(const x of w){const n=c?c+" "+x:x;if(g.measureText(n).width>mw&&c){L.push(c);c=x}else c=n}L.push(c);return L}
function draw(t){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);g.fillStyle="#04050c";g.fillRect(0,0,W,H);
stars.forEach(s=>{g.globalAlpha=.5+.5*Math.sin(t*2+s.p);g.fillStyle="#fff";g.fillRect(s.x,s.y,s.r,s.r)});g.globalAlpha=1;
g.save();if(t>15&&t<22)g.translate(Math.sin(t*61)*14,Math.cos(t*47)*14);
const D=dist(t),ym=400+200*sm((t-4)/17),r=Math.min(470,36*Math.pow(384.4/D,.9));
ringPart(t,false);earth(t);ringPart(t,true);if(t<22.3)moon(540,ym,r,1-sm((t-21)/1.2));panel(t);g.restore();
g.textAlign="center";g.fillStyle="#fff";g.font="bold 54px system-ui,sans-serif";g.fillText("BAGAIMANA JIKA BULAN MENDEKATI BUMI?",540,130);
g.font="bold 64px system-ui,sans-serif";g.fillStyle=t>=21?"#ff7a5a":"#7cc4ff";g.fillText(t>=21?"BATAS ROCHE: Bulan hancur":"Jarak: "+fmt(D*1000)+" km",540,230);
const sc=S.find(s=>t>=s[0]&&t<s[1])||S[5];g.globalAlpha=sm((t-sc[0])/.3);g.font="bold 56px system-ui,sans-serif";const L=wrap(sc[2],900),bh=L.length*72+40,by=1860-bh;g.fillStyle="rgba(0,0,0,.6)";g.fillRect(60,by,960,bh);g.fillStyle="#fff";L.forEach((l,i)=>g.fillText(l,540,by+68+i*72));g.globalAlpha=1;
if(t>=21&&t<21.5){g.fillStyle=`rgba(255,255,255,${1-(t-21)/.5})`;g.fillRect(0,0,W,H)}
const f=clamp(t/.4)*clamp((DUR-t)/.4);if(f<1){g.fillStyle=`rgba(0,0,0,${1-f})`;g.fillRect(0,0,W,H)}}
window.seek=draw;draw(0);
if(!RENDER){const a=document.getElementById("a"),pp=document.getElementById("pp"),tm=document.getElementById("tm");let t=0,pl=false,last=0;
const play=()=>{if(t>=DUR)t=0;pl=true;pp.textContent="Jeda";try{a.currentTime=t;a.play()}catch(e){}},pause=()=>{pl=false;pp.textContent="Putar";a.pause()};
pp.onclick=()=>pl?pause():play();document.getElementById("rs").onclick=()=>{t=0;play()};
(function tick(n){if(pl){t+=(n-last)/1000;if(t>=DUR){t=DUR;pause()}}last=n;draw(t);tm.textContent=t.toFixed(1)+" / 30 d";requestAnimationFrame(tick)})(0)}
</script></body></html>
